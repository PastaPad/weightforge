[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-scratch-llm"
version = "0.1.0"
description = "A from-scratch, locally trained CUDA language model"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "tokenizers>=0.20",
  "camoufox>=0.4.11",
  "curl_cffi>=0.7",
  "psutil>=5.9",
  "beautifulsoup4>=4.12",
  "libzim>=3.13.1,<4",
  "gguf>=0.19,<0.20",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
huggingface = [
  "transformers>=5.20.2,<5.21",
  "peft>=0.21.2,<0.22",
  "accelerate>=1.15,<1.16",
  "bitsandbytes>=0.50.2,<0.51",
  "huggingface_hub>=1.31,<3",
  "filelock>=3.16,<4",
  "sentencepiece>=0.2.1,<0.3",
  "safetensors>=0.8,<0.9",
]

[tool.setuptools.packages.find]
include = ["scratchllm*"]

[tool.setuptools.package-data]
scratchllm = ["web/*.html"]
